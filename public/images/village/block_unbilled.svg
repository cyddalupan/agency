<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Card 6b07f356b6b30ea65c7bc2de — the UNBILLED body.
       Deliberately a different silhouette from every paid shape: no roof
       pitch, no flag, no lit windows. Slate grey, boarded openings. At 50%
       zoom the outline alone tells you this one has no billing agreement. -->
  <ellipse cx="100" cy="222" rx="70" ry="13" fill="#000" opacity=".38"/>
  <!-- block shell: flat top, no pitched roof -->
  <path d="M46 86 L154 86 L154 200 L46 200 Z" fill="#4a5468"/>
  <path d="M154 86 L178 96 L178 208 L154 200 Z" fill="#39424f"/>
  <!-- flat coping -->
  <rect x="42" y="80" width="116" height="9" rx="2" fill="#5b6579"/>
  <!-- boarded windows -->
  <g fill="#2b323d">
    <rect x="62" y="112" width="26" height="30" rx="2"/>
    <rect x="104" y="112" width="26" height="30" rx="2"/>
    <rect x="62" y="158" width="26" height="30" rx="2"/>
  </g>
  <g stroke="#6b7689" stroke-width="3" stroke-linecap="round">
    <line x1="62" y1="120" x2="88" y2="134"/><line x1="62" y1="134" x2="88" y2="120"/>
    <line x1="104" y1="120" x2="130" y2="134"/><line x1="104" y1="134" x2="130" y2="120"/>
  </g>
  <!-- boarded door -->
  <rect x="104" y="158" width="26" height="30" rx="2" fill="#2b323d"/>
  <line x1="104" y1="166" x2="130" y2="180" stroke="#6b7689" stroke-width="3" stroke-linecap="round"/>
  <!-- no-billing plate: a dash, not a sign -->
  <rect x="76" y="52" width="48" height="22" rx="4" fill="#1b2436" stroke="#55647f" stroke-width="1.5"/>
  <text x="100" y="67" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12"
    fill="#8b96ab" text-anchor="middle" font-weight="700">—</text>
  <line x1="100" y1="74" x2="100" y2="82" stroke="#55647f" stroke-width="2.5"/>
</svg>
